name: Reproducibility tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild numerical outputs
        run: python analysis.py
      - name: Run automated tests
        run: python -m unittest -v test_analysis
      - name: Require exact committed numerical outputs
        run: git diff --exit-code -- output/ruptures.csv output/recoveries.csv output/records.csv
